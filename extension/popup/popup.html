<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AutoPiP Settings</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <header>
    <div class="header-icon">
      <svg viewBox="0 0 24 24" width="16" height="16" fill="white">
        <path d="M21 3H3c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h18c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm0 16H3V5h18v14zm-10-7h8v5h-8z"/>
      </svg>
    </div>
    <h1>AutoPiP</h1>
    <div id="status-badge" class="badge">—</div>
  </header>

  <main>
    <!-- Enable -->
    <section class="row">
      <label for="toggle-enabled">
        <span class="label-text">Enable AutoPiP</span>
        <span class="label-sub">Auto PiP on tab switch</span>
      </label>
      <label class="switch">
        <input type="checkbox" id="toggle-enabled">
        <span class="slider"></span>
      </label>
    </section>

    <!-- Mute tab -->
    <section class="row">
      <label for="toggle-mute">
        <span class="label-text">Mute tab in PiP</span>
        <span class="label-sub">Silences tab audio while PiP is open</span>
      </label>
      <label class="switch">
        <input type="checkbox" id="toggle-mute">
        <span class="slider"></span>
      </label>
    </section>

    <!-- Keyboard shortcut -->
    <section class="shortcut-row">
      <span class="label-text">Toggle PiP</span>
      <div class="shortcut-keys">
        <kbd>Alt</kbd><span class="key-sep">+</span><kbd>P</kbd>
        <a id="shortcut-link" href="#" class="shortcut-change">change</a>
      </div>
    </section>

    <hr>

    <!-- Sites -->
    <section>
      <div class="sites-header">
        <h2 id="sites-label">Excluded sites</h2>
        <div class="mode-pills">
          <button id="btn-blacklist" class="pill active">Blacklist</button>
          <button id="btn-whitelist" class="pill">Whitelist</button>
        </div>
      </div>
      <p class="hint" id="sites-hint">AutoPiP is disabled on these sites.</p>
      <textarea id="sites-textarea" rows="4" placeholder="meet.google.com&#10;zoom.us"></textarea>
      <button id="btn-add-current">+ Add current site</button>
    </section>

    <hr>

    <!-- Advanced -->
    <section>
      <h2>Advanced</h2>
      <div class="row">
        <label for="debounce-delay">
          <span class="label-text">Activation delay</span>
          <span class="label-sub" id="debounce-display">300 ms</span>
        </label>
        <input type="range" id="debounce-delay" min="0" max="2000" step="100" value="300">
      </div>
      <div class="row">
        <label for="min-video-area">
          <span class="label-text">Min. video size</span>
          <span class="label-sub" id="area-display">200 × 200 px</span>
        </label>
        <input type="range" id="min-video-area" min="10000" max="200000" step="5000" value="40000">
      </div>
    </section>

    <hr>

    <!-- Manual / Brave -->
    <section>
      <h2>Manual control</h2>
      <p class="hint">For Brave or sites blocking auto-detection.</p>
      <button id="btn-force-pip" class="btn-primary">▶ Enter PiP on current tab</button>
    </section>
  </main>

  <footer>
    <span id="status-text">Ready</span>
    <a href="https://github.com/AntoineVassort/autopip" target="_blank" rel="noopener">GitHub</a>
  </footer>

  <script src="popup.js"></script>
</body>
</html>
